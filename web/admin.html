<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REX admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&f[]=sentient@400,500,700&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.png">
<style>
  /* Dashboard-only styles. Everything else comes from the site's own sheet,
     so this reads as part of REX rather than a bolted-on admin tool. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; margin: 0 0 1rem; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .85rem .95rem; }
  .kpi .v { font-family: "Sentient", Georgia, serif; font-size: 1.75rem; font-weight: 600; line-height: 1;
            font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: .35rem; }
  .kpi .s { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
  .kpi.accent .v { color: var(--forest); }
  h2 { font-size: 1.15rem; margin: 2.2rem 0 .8rem; }
  .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .5rem; }
  .pair { display: flex; align-items: baseline; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .pair .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pair .r { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
  table.lean { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.lean td { padding: .45rem 0; border-bottom: 1px solid var(--line); }
  table.lean td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-top: .5rem; }
  .bars div { flex: 1; background: var(--forest); opacity: .75; border-radius: 2px 2px 0 0; min-height: 2px; }
  .bars div:last-child { opacity: 1; }
  form.signin { max-width: 22rem; }
  form.signin input { width: 100%; padding: .7rem .8rem; margin-bottom: .6rem; font: inherit;
                      border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .err { color: #9C2C1E; font-size: .9rem; }
  .who { font-size: .85rem; color: var(--muted); }
  .who button { font: inherit; color: var(--forest); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/"><img class="mark" src="/dinologo.png" alt=""><img class="word" src="/wordmark.png" alt="REX"></a>
  <nav class="site"><a href="/">Site</a></nav>
</div></header>

<main><div class="wrap">
  <h1>Admin</h1>
  <div id="root"><p class="muted">Loading…</p></div>
</div></main>

<footer class="site"><div class="wrap">
  <p class="muted">Only the three of us can see this. Everyone else gets nothing — the database refuses the query, not the page.</p>
</div></footer>

<script src="/admin.js" defer></script>
</body>
</html>
