# Nov 7 — Nick's point 4. There was no .github directory at all before this,
# which is also why Dependabot was raising alerts and never opening a pull
# request to fix one.
#
# Four jobs because REX is four codebases in one repository, and each has its
# own toolchain: the website (plain JS, linted), the edge functions (Deno),
# Android (Gradle) and iOS (Xcode). They run in parallel and none depends on
# another.
#
# Deliberately not here yet:
#   * Tests. There are none to run. Adding a green "tests" job that executes
#     nothing is worse than no job, because it reads as covered.
#   * Deploys. find-rex.com is built by Cloudflare Pages from this repo
#     already, and the two apps are released by hand through App Store
#     Connect and Play. CI here is a gate, not a pipeline.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a dependency bump can be checked without waiting for the schedule.
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here has side
# effects, so there is no reason to finish a run that is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Website and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      # Reports, does not fail the build. These are eslint and prettier,
      # which never touch a request or a user's data, so a transitive
      # advisory here is worth seeing and not worth blocking a release on.
      # Revisit the moment anything here runs in production.
      - name: npm audit
        run: npm audit --audit-level=high || true

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The nine functions run with the service-role key, so a type error
      # here is the most expensive kind in the repository.
      # Nov 16 — --node-modules-dir=auto. The functions import one thing,
      # jsr:@supabase/supabase-js@2, and that package's own types reach for
      # npm:openai and npm:@supabase/realtime-js. Without somewhere to put
      # them Deno reported "Failed resolving types. Could not find a matching
      # package ... in the node_modules directory" for every function, so this
      # job has been red since it was written and told us nothing about our
      # own code either way.
      - name: Type-check every function
        run: |
          failed=0
          for fn in supabase/functions/*/index.ts; do
            echo "::group::$fn"
            deno check --allow-import --node-modules-dir=auto "$fn" || failed=1
            echo "::endgroup::"
          done
          exit $failed
      - name: Format check
        run: deno fmt --check supabase/functions || true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      # Report-only for now. Android lint has never been run against this
      # project, so its first output is a backlog rather than a regression,
      # and a job that is red from the day it is created gets ignored. The
      # report is kept as an artifact below; make this blocking once the
      # backlog it finds has been worked through.
      - name: Lint
        working-directory: android
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon
      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Nov 16 — the runner's default Xcode was 16.4, which ships the iOS 18
      # SDK, and the app uses iOS 26 APIs behind #available guards. A guard
      # decides what runs; the symbol still has to exist to compile. So every
      # iOS run failed on .sharedBackgroundVisibility and had done since that
      # line was written, while the same build passed on a laptop running
      # Xcode 27.
      #
      # Picking the newest Xcode present rather than naming a version: the
      # runner images change under us, and a hard-coded Xcode_26.app is the
      # same trap one release later. The listing is printed so that if the
      # newest available is still too old, the log says so outright instead
      # of failing somewhere in the middle of a compile.
      - name: Use the newest Xcode on the runner
        run: |
          echo "Xcodes available:"
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      # A simulator build, so nothing here needs a signing certificate and no
      # secret has to live in the repository for CI to work.
      #
      # Nov 17 — nothing is stubbed in before this step, and nothing should be.
      # Fixing the two errors above let the build reach the resource-copy phase
      # for the first time, and it failed there: the project listed `public/`,
      # `capacitor.config.json` and `config.xml` in Copy Bundle Resources, all
      # three excluded by ios/.gitignore, so no clone of this repository had
      # ever been able to build the app. They were briefly faked in here. They
      # are now out of the project instead, which is what a clean checkout
      # building proves. If this job ever fails on a missing Capacitor file
      # again, something has put one of them back.
      - name: Build
        working-directory: ios/App
        run: |
          xcodebuild build \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
